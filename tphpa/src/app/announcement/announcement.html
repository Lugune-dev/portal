<div class="bg-gray-50 min-h-screen py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="mb-10 flex justify-between items-end">
      <div>
        <h2 class="text-3xl font-extrabold text-gray-900">Habari na Matangazo</h2>
        <p class="mt-2 text-lg text-gray-600">Pata taarifa za hivi punde kutoka idara mbalimbali.</p>
      </div>
      <button class="text-blue-600 font-semibold hover:underline">Tazama Zote &rarr;</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let item of newsList" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow">
        
        <div class="h-48 bg-gray-200 relative">
          <span class="absolute top-4 left-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase">
            {{ item.category }}
          </span>
          </div>

        <div class="p-6">
          <div class="flex items-center text-xs text-gray-500 mb-3">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            {{ item.date | date:'longDate' }}
          </div>
          
          <h3 class="text-xl font-bold text-gray-900 mb-2 leading-tight">
            {{ item.title }}
          </h3>
          
          <p class="text-gray-600 text-sm mb-4 line-clamp-3">
            {{ item.content }}
          </p>
          
          <button class="w-full py-2 bg-gray-50 text-blue-700 font-bold rounded-lg border border-blue-100 hover:bg-blue-50 transition">
            Soma Zaidi
          </button>
        </div>
      </div>
      </div>

  </div>
</div>
